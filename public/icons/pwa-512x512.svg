    <rect x="152" y="454" width="66" height="57" rx="12" fill="url(#pwaDarkTile1)" filter="url(#pwaDarkTileShadow)" stroke="#383a47" stroke-width="1.2" />
    <rect x="225" y="454" width="66" height="57" rx="12" fill="url(#pwaDarkTile2)" filter="url(#pwaDarkTileShadow)" stroke="#383a47" stroke-width="1.2" />
    <rect x="298" y="454" width="66" height="57" rx="12" fill="url(#pwaDarkTile3)" filter="url(#pwaDarkTileShadow)" stroke="#383a47" stroke-width="1.2" />
