    <rect x="444" y="454" width="66" height="57" rx="12" fill="url(#pwaDarkTile2)" filter="url(#pwaDarkTileShadow)" stroke="#383a47" stroke-width="1.2" />

    <!-- Foreground: 4 Vertical x 3 Horizontal Letter 'C' -->
