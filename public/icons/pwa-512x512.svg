    <rect x="6" y="134" width="66" height="57" rx="12" fill="url(#pwaDarkTile3)" filter="url(#pwaDarkTileShadow)" stroke="#383a47" stroke-width="1.2" />
    <rect x="79" y="134" width="66" height="57" rx="12" fill="url(#pwaDarkTile1)" filter="url(#pwaDarkTileShadow)" stroke="#383a47" stroke-width="1.2" />
    <rect x="371" y="134" width="66" height="57" rx="12" fill="url(#pwaDarkTile2)" filter="url(#pwaDarkTileShadow)" stroke="#383a47" stroke-width="1.2" />
