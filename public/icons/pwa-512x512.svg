<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Canvas Base -->
    <linearGradient id="pwaBgBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151a" />
      <stop offset="100%" stop-color="#0a0b0e" />
    </linearGradient>

    <!-- Clip path to round the entire full-bleed grid into the app squircle -->
    <clipPath id="pwaIconClip">
      <rect width="512" height="512" rx="116" />
    </clipPath>

    <!-- Dark Grid Tile Subtle Variations -->
    <linearGradient id="pwaDarkTile1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c2d36" />
      <stop offset="100%" stop-color="#1e1f26" />
    </linearGradient>

    <linearGradient id="pwaDarkTile2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24252e" />
      <stop offset="100%" stop-color="#181920" />
    </linearGradient>

    <linearGradient id="pwaDarkTile3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#31323c" />
      <stop offset="100%" stop-color="#21222a" />
    </linearGradient>

    <!-- 3D Electric Violet Tile Gradients for 'C' -->
    <linearGradient id="pwaVioletFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="55%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>

    <linearGradient id="pwaVioletHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F3E8FF" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#C084FC" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="pwaVioletSideRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#4C1D95" stop-opacity="0.45" />
    </linearGradient>

    <linearGradient id="pwaVioletSideBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#3B0764" stop-opacity="0.6" />
    </linearGradient>

    <!-- Elevated Drop Shadow for Active 3D Blocks -->
    <filter id="pwaBlockShadow" x="-25%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <filter id="pwaDarkTileShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base App Squircle Container -->
  <rect width="512" height="512" rx="116" fill="url(#pwaBgBase)" />

  <g clip-path="url(#pwaIconClip)">
    <!-- Row 0 (y=6): All 7 Dark -->
    <rect x="6" y="6" width="66" height="57" rx="12" fill="url(#pwaDarkTile1)" filter="url(#pwaDarkTileShadow)" stroke="#383a47" stroke-width="1.2" />
    <rect x="79" y="6" width="66" height="57" rx="12" fill="url(#pwaDarkTile2)" filter="url(#pwaDarkTileShadow)" stroke="#383a47" stroke-width="1.2" />
    <rect x="152" y="6" width="66" height="57" rx="12" fill="url(#pwaDarkTile3)" filter="url(#pwaDarkTileShadow)" stroke="#383a47" stroke-width="1.2" />
