name: Reset Demo Database

on:
  schedule:
    # Runs every Monday and Thursday at 5:00 AM IRST (01:30 UTC)
    - cron: '30 1 * * 1,4'
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger demo reset
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "https://chronicle-release.vercel.app/api/reset-demo" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $response"
          if [ "$response" != "200" ]; then
            echo "Reset failed with status $response"
            exit 1
          fi
          echo "Demo database reset successfully"