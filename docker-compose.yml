services:
    postgres:
        image: postgres:17.5
        container_name: chronicle-db
        restart: always
        environment:
            POSTGRES_USER: ${DATABASE_USER}
            POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
            POSTGRES_DB: ${DATABASE_DB}
        volumes:
            - db:/var/lib/postgresql/data
        ports:
            - "5434:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER}"]
            interval: 10s
            timeout: 5s
            retries: 5
volumes:
    db:
